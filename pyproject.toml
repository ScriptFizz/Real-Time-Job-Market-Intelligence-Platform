[tool.poetry]
name = "Real-Time-Job-Market-Intelligence-Platform"
version = "0.1.0"
description = "A system that scrapes job postings, processes them at scale, extracts skills using NLP, and stores analytics in a data warehouse."
authors = ["ScriptFizz <nsimamail@gmail.com>"]
readme = "README.md"
packages = [{ include = "job_plat", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.8,<3.12"
pandas = [
  { version = ">=2.3.3,<3.0.0", python = ">=3.9" },
  { version = ">=1.5,<2.0", python = ">=3.8,<3.9" }
]
numpy = ">=1.24.4,<2.0.0"
pyyaml = ">=6.0.3,<7.0.0"
requests = ">=2.32.5,<3.0.0"
python-dateutil = ">=2.9.0.post0,<3.0.0"
tqdm = ">=4.67.1,<5.0.0"
dotenv = ">=0.9.9,<0.10.0"
typer = ">=0.20.0,<0.21.0"
rich = "^13.7"
tenacity = "^8.3"
pydantic = "^2.7"
sentence-transformers = "^5.2.3"
psycopg2-binary = "^2.9.11"
python-json-logger = "^2.0.7"
torch = {version = "2.2.2", source = "pytorch-cpu"}
apache-airflow = "==2.9.0"

[tool.poetry.group.spark.dependencies]
pyspark = ">=3.5.1,<4.0.0"


[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
black = {version = ">=25.12.0,<26.0.0", python = ">=3.10"}
mypy = ">=1.19.0,<2.0.0"
pytest = { version = "^9.0.2", python = ">=3.10" }
faker = {version = ">=38.2.0,<39.0.0", python = ">=3.10"}
pre-commit = { version = ">=4.5.0,<5.0.0", python = ">=3.10" } #">=4.5.0,<5.0.0"
ruff = ">=0.14.8,<0.15.0"
types-requests = ">=2.32.4.20250913,<3.0.0.0"

[tool.poetry.group.viz]
optional=true
[tool.poetry.group.viz.dependencies]
matplotlib = "^3.7.5"
seaborn = "^0.13.2"

[tool.poetry.group.notebook]
optional=true
[tool.poetry.group.notebook.dependencies]
jupyterlab = "^4.1"
ipykernel = {version = ">=7.1.0,<8.0.0", python = ">=3.10"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
