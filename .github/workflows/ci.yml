name: CI

on:
  push:
    branches:
      - main
      - feature-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SPARK_LOCAL_IP: "127.0.0.1"

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java for Spark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Verify lockfile
        run: poetry check

      - name: Install project
        run: poetry install --with dev,airflow --no-interaction

      - name: Verify CPU-only Torch
        run: |
          poetry run python - <<'PY'
          import torch

          assert torch.version.cuda is None, (
              f"Expected CPU-only Torch, got CUDA {torch.version.cuda}"
          )
          print(f"Torch {torch.__version__}: CPU-only")
          PY

      - name: Build package
        run: poetry build

      - name: Verify installed CLI
        run: poetry run job-plat --help

      - name: Check formatting
        run: poetry run ruff format --check src tests

      - name: Run lint checks
        run: poetry run ruff check src tests

      - name: Run type checks
        run: poetry run mypy src --no-incremental

      - name: Run test suite
        run: >-
          poetry run pytest -p no:cacheprovider -q
          --cov=job_plat
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true
