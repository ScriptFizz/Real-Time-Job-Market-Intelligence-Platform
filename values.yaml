executor: CeleryExecutor #KubernetesExecutor #LocalExecutor

postgresql:
  enabled: true

  auth:
    postgresPassword: postgres
    username: airflow
    password: airflow
    database: airflow

  image:
    repository: postgres
    tag: 15-alpine

  primary:

    persistence:
      enabled: true
      existingClaim: jobplat-data-pvc

    podSecurityContext:
      enabled: true
      fsGroup: 999

    containerSecurityContext:
      enabled: true
      runAsUser: 999

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"

      limits:
        memory: "512Mi"
        cpu: "300m"


