kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            "runtime-config": "api/all=true"
    extraPortMappings:
      - containerPort: 30007
        hostPort: 8080
